<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            background: #0d0d0d;
            color: #e6e6e6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            text-align: center;
            padding: 30px 40px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 0 20px #0008;
        }

        h2 {
            margin-bottom: 10px;
            color: #ff4d4d;
        }

        p {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Access Denied</h2>
    <p>You are not authorized to view this page.</p>
</div>

</body>
</html>
